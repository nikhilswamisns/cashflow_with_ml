<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CashFlow">
  <defs>
    <linearGradient id="cfg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#cfg)"/>
  <!-- bars -->
  <rect x="13" y="38" width="7" height="13" rx="2" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="24" y="32" width="7" height="19" rx="2" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="35" y="35" width="7" height="16" rx="2" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="46" y="24" width="7" height="27" rx="2" fill="#ffffff" fill-opacity="0.35"/>
  <!-- rising flow line with arrow -->
  <polyline points="12,34 25,25 36,29 49,15" fill="none" stroke="#ffffff" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="41,14 50,14 50,23" fill="none" stroke="#ffffff" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
