<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.55" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0369a1" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="720" fill="url(#sky)"/>

  <!-- soft light circles -->
  <circle cx="470" cy="120" r="150" fill="#ffffff" opacity="0.35"/>
  <circle cx="90" cy="250" r="90" fill="#ffffff" opacity="0.25"/>

  <!-- chart card -->
  <g filter="url(#soft)">
    <rect x="90" y="190" width="420" height="300" rx="28" fill="#ffffff" fill-opacity="0.55"/>
  </g>
  <!-- grid -->
  <g stroke="#0ea5e9" stroke-opacity="0.18" stroke-width="2">
    <line x1="130" y1="260" x2="470" y2="260"/>
    <line x1="130" y1="320" x2="470" y2="320"/>
    <line x1="130" y1="380" x2="470" y2="380"/>
    <line x1="130" y1="440" x2="470" y2="440"/>
  </g>
  <!-- bars -->
  <g fill="url(#bar)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2">
    <rect x="145" y="372" width="38" height="68" rx="9"/>
    <rect x="207" y="336" width="38" height="104" rx="9"/>
    <rect x="269" y="356" width="38" height="84" rx="9"/>
    <rect x="331" y="300" width="38" height="140" rx="9"/>
    <rect x="393" y="262" width="38" height="178" rx="9"/>
  </g>
  <!-- flow line -->
  <polyline points="164,350 226,308 288,326 350,268 412,226" fill="none" stroke="#2563eb" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="5">
    <circle cx="164" cy="350" r="8"/><circle cx="226" cy="308" r="8"/><circle cx="288" cy="326" r="8"/>
    <circle cx="350" cy="268" r="8"/>
  </g>
  <polyline points="388,222 414,224 410,250" fill="none" stroke="#2563eb" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- coins -->
  <g filter="url(#soft)">
    <circle cx="470" cy="500" r="42" fill="#ffffff" fill-opacity="0.85" stroke="#38bdf8" stroke-width="5"/>
    <circle cx="470" cy="500" r="28" fill="none" stroke="#7dd3fc" stroke-width="4"/>
    <circle cx="410" cy="532" r="30" fill="#ffffff" fill-opacity="0.8" stroke="#38bdf8" stroke-width="4"/>
  </g>

  <!-- waves -->
  <path d="M0 560 C 120 520, 220 600, 340 565 S 520 520, 600 545 L600 720 L0 720 Z" fill="url(#wave1)"/>
  <path d="M0 615 C 140 585, 250 650, 380 615 S 540 590, 600 605 L600 720 L0 720 Z" fill="url(#wave2)"/>
</svg>
